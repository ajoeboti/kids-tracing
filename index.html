<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
  <title>Kids Tracing Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1 class="title">Kids Tracing Practice</h1>
    <p class="progress" id="progress">1 / 62</p>
  </header>

  <main class="card">
    <div class="stage">
      <p class="guide" id="guide">A</p>
      <canvas class="trace-canvas" id="trace-canvas" width="300" height="300" aria-hidden="true"></canvas>
    </div>

    <div class="stars" role="img" aria-label="No stars yet">
      <span class="star" aria-hidden="true">★</span>
      <span class="star" aria-hidden="true">★</span>
      <span class="star" aria-hidden="true">★</span>
    </div>

    <div class="controls">
      <button type="button" class="control" id="prev-button" aria-label="Previous">←</button>
      <button type="button" class="control" id="clear-button">Clear</button>
      <button type="button" class="control" id="next-button" aria-label="Next">→</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
